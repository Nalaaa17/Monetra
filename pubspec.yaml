name: monetra
description: "Aplikasi Pencatatan Keuangan Pribadi (Multi-Wallet)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Typography & Formatting
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Charts & Visualizations
  fl_chart: ^0.70.2

  # Animations & Effects
  confetti: ^0.8.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_svg: ^2.3.3

  # Image & Media
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/banks/
    - assets/images/banks/svg/
